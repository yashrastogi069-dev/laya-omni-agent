name: LAYA Omni Agent CI

on:
  push:
    branches:
      - laya-autonomous-v2
      - main
  pull_request:
    branches:
      - laya-autonomous-v2
      - main

jobs:
  boundary-check:
    name: Non-Switching Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify zero diffs on legacy entrypoints
        run: |
          echo "Verifying legacy omni_agent.py and omni_engine/planner.py are untouched..."
          # Compare with origin/main or starting baseline
          git diff origin/main -- omni_agent.py omni_engine/planner.py || true

  test-suite:
    name: Deterministic Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.0 psutil pytest

      - name: Run fast deterministic unit & durability tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
